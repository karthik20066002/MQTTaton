track = "C"
one_line_pitch = "Zero-dependency MQTT v5 broker implemented entirely with Go standard library"

# Zero-Dependency Hackathon Submission
# Track C — Web & Network: TCP-based MQTT broker with concurrent client handling

[project]
name = "MQTTaton"
description = "A zero-dependency MQTT v5 broker written entirely in Go using only the standard library"
language = "Go"
version = "1.27.0"

[build]
command = "make build"
output = "bin/mqttaton"

[features]
- Full MQTT v5 protocol compliance
- QoS 0, 1, and 2 message delivery
- Topic-based subscription system with wildcard support
- Client authentication and access control
- Concurrent client handling with goroutines
- Zero third-party dependencies
- Single executable deployment
- Graceful shutdown handling

[stdlib_substitutions]
# Key stdlib substitutions that make this project possible
mqtt_protocol = "net + encoding/binary + bytes + io"
concurrency = "sync + goroutines + channels"
authentication = "flag + input validation"
error_handling = "fmt.Errorf + custom error types"
message_routing = "strings + custom topic matching"
networking = "net.Listen + net.Accept + net.Conn"

[compliance]
- Zero runtime dependencies: ✅
- Empty go.mod require block: ✅
- Standard library only: ✅
- No external package imports: ✅
- Single executable build: ✅

[bonus_challenges]
# Potential bonus challenges applicable
package_killer = "Replaces full MQTT libraries like eclipse/paho.mqtt.golang"
single_file = "Could be implemented as single file (bonus: +5)"
reproducible_build = "Go build is deterministic (bonus: +5)"